services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sewasetu
      DB_USER: sewasetu
      DB_PASSWORD: sewasetu123
      SMS_GATEWAY_URL: http://smsgw:8025
      DOCKER_CONTAINER: "true"
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  scheduler:
    build: .
    command: ["sh", "-c", "until python /app/app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sewasetu
      DB_USER: sewasetu
      DB_PASSWORD: sewasetu123
      SMS_GATEWAY_URL: http://smsgw:8025
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
